<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Manager</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --dark: #334155;
            --dark-hover: #1e293b;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-focus: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            padding: 28px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* Top Add Form */
        .todo-form {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .todo-form input[type="text"] {
            flex: 1 1 200px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .todo-form input[type="text"]:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* Shared Buttons */
        .btn {
            padding: 8px 14px;
            font-size: 0.875rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s, transform 0.05s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            padding: 10px 18px;
            font-size: 0.95rem;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-dark {
            background-color: var(--dark);
            color: white;
        }

        .btn-dark:hover {
            background-color: var(--dark-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        /* Table Structure */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        th {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            background-color: #f8fafc;
        }

        /* Table Inputs Styling */
        .table-input {
            width: 100%;
            padding: 7px 10px;
            font-size: 0.9rem;
            color: var(--text-main);
            background-color: transparent;
            border: 1px solid transparent;
            border-radius: 5px;
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        .table-input:hover {
            border-color: var(--border);
            background-color: #fcfcfd;
        }

        .table-input:focus {
            background-color: #ffffff;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
        }

        /* Completed Task Visual State */
        .is-completed .table-input {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* Custom Checkbox */
        .todo-checkbox {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            vertical-align: middle;
        }

        .empty-state {
            text-align: center;
            padding: 28px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Todo List</h1>

    <!-- Add Todo Form -->
    <form class="todo-form" th:action="@{/addTodo}" method="post">
        <input type="text" name="taskContent" placeholder="Task title..." required />
        <input type="text" name="taskDesc" placeholder="Description (optional)" />
        <button type="submit" class="btn btn-primary">Add Task</button>
    </form>

    <!-- Todos Table -->
    <div class="table-responsive">
        <table>
            <thead>
            <tr>
                <th style="width: 48px; text-align: center;">Done</th>
                <th style="width: 35%;">Task</th>
                <th>Description</th>
                <th style="width: 90px; text-align: center;">Save</th>
                <th style="width: 90px; text-align: center;">Delete</th>
            </tr>
            </thead>
            <tbody>
            <!-- Iterate over items -->
            <tr th:each="todo : ${listOfTodos}" th:classappend="${todo.completionStatus} ? 'is-completed'">
                <td style="text-align: center;">
                    <input type="checkbox"
                           class="todo-checkbox"
                           name="completionStatus"
                           th:form="'update-form-' + ${todo.id}"
                           th:checked="${todo.completionStatus}"
                           onchange="this.form.submit()" />
                </td>
                <td>
                    <!-- Tied to the update form via the HTML5 form attribute -->
                    <input type="text"
                           class="table-input"
                           name="taskContent"
                           th:value="${todo.taskContent}"
                           th:form="'update-form-' + ${todo.id}" />
                </td>
                <td>
                    <input type="text"
                           class="table-input"
                           name="taskDesc"
                           th:value="${todo.taskDesc}"
                           th:form="'update-form-' + ${todo.id}" />
                </td>
                <td style="text-align: center;">
                    <!-- Update Form -->
                    <form th:id="'update-form-' + ${todo.id}" th:action="@{/updateTodo/{id}(id=${todo.id})}" method="post">
                        <button type="submit" class="btn btn-dark">Update</button>
                    </form>
                </td>
                <td style="text-align: center;">
                    <!-- Delete Form -->
                    <form th:action="@{/deleteTodo/{id}(id=${todo.id})}" method="post">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </td>
            </tr>

            <!-- Empty State Check (matches listOfTodos) -->
            <tr th:if="${#lists.isEmpty(listOfTodos)}">
                <td colspan="5" class="empty-state">No tasks yet. Add one above!</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
