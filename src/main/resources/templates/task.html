<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Manager</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            padding: 28px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* Form Styling */
        .todo-form {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .todo-form input[type="text"] {
            flex: 1 1 200px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .todo-form input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 10px 18px;
            font-size: 0.95rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        /* Table Styling */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            background-color: #f1f5f9;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .completed-task {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .checkbox-form {
            display: inline;
        }

        .checkbox-form input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Todo List</h1>

    <!-- Add Todo Form -->
    <form class="todo-form" th:action="@{/addTodo}" method="post">
        <input type="text" name="taskContent" placeholder="Task title..." required />
        <input type="text" name="taskDesc" placeholder="Description (optional)" />
        <button type="submit" class="btn btn-primary">Add Task</button>
    </form>

    <!-- Todos Table -->
    <div class="table-responsive">
        <table>
            <thead>
            <tr>
                <th style="width: 50px;">Done</th>
                <th>Task</th>
                <th>Description</th>
                <th style="width: 80px; text-align: center;">Action</th>
                <th style="width: 80px; text-align: center;">Action</th>
            </tr>
            </thead>
            <tbody>
            <!-- Iterate over todos passed from the Spring controller -->
            <tr th:each="todo : ${listOfTodos}">


                    <!-- Submits immediately on click to update completion status -->
                    <form th:action="@{/updateTodo/{id}(id=${todo.id})}" method="post">
                        <td>
                            <input type="checkbox" name="completionStatus"
                                   th:checked="${todo.completionStatus}"
                                   onchange="this.form.submit()" />
                        </td>
                        <td th:classappend="${todo.completionStatus} ? 'completed-task'">
                            <input type="text" name="taskContent" th:value="${todo.taskContent}" />
                        </td>
                        <td th:classappend="${todo.completionStatus} ? 'completed-task'">
                            <input type="text" name="taskDesc" th:value="${todo.taskDesc}" />
                        </td>

                        <td><button type="submit" class="btn btn-dark">Update</button></td>
                    </form>


<!--                <td style="text-align: center;">-->
<!--                    <form th:action="@{/updateTodo/{id}(id=${todo.id})}" method="post" style="display:inline;">-->
<!--                        <button type="submit" class="btn btn-dark">Update</button>-->
<!--                    </form>-->
<!--                </td>-->

                <td style="text-align: center;">
                    <form th:action="@{/deleteTodo/{id}(id=${todo.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </td>
            </tr>

            <!-- Message displayed when list is empty -->
            <tr th:if="${#lists.isEmpty(todos)}">
                <td colspan="4" class="empty-state">No tasks yet. Add one above!</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
